<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>
    <script src="https://raw.githack.com/AR-js-org/AR.js/3.4.7/aframe/build/aframe-ar.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/aframe-extras@7.5.4/dist/aframe-extras.min.js"></script>

    <style>
        #hub{
            position:fixed;
            top:20px;
            left:20px;
            z-index:999;
        }

        button{
            font-size:20px;
            padding:12px 20px;
            border:none;
            background-color:royalblue;
            color:white;
            border-radius:10px;
            margin-right:10px;
        }
        

        select{
            font-size:18px;
            padding:10px 12px;
            border-radius:8px;
        }

    </style>    
</head>

<body>
    <div id="hub">
        <select id="animationSelect">
            <option value="Attack" >攻撃</option>
            <option value="Death">倒れる</option>
            <option value="Eating">食べる</option>
            <option value="Gallop">走る</option>
            <option value="Walk" selected>歩く</option>
        </select>
        <button id="enlargeButton">拡大</button>
        <button id="rotateButton">回転</button>

        <button id="enlargeButton02">縮小</button>
        <button id="rotateButton02">逆回転</button>    
    </div>    


    <a-scene embedded arjs="sourceType: webcam">

        <a-marker preset="hiro" smooth="true">
            <a-entity id="model" position="0 0 0.5">
            <a-gltf-model id="ookami" src="ookami.glb" position="0 0 0" scale="0.3 0.3 0.3" rotation="-90 0 0"
            animation-mixer="clip:Walk">
            </a-gltf-model>
        </a-entity>    

        </a-marker>

        <a-entity camera></a-entity>

    </a-scene>

    <script>
        

        const ookami=document.getElementById("ookami");
        
        const animationSelect=document.getElementById("animationSelect");
        const model=document.getElementById("model");
        const enlargeButton=document.getElementById("enlargeButton");
        const rotateButton=document.getElementById("rotateButton");
        const enlargeButton02=document.getElementById("enlargeButton02")
        const rotateButton02=document.getElementById("rotateButton02")

        let size=1;

        function enlargeModel(){
            size=size+0.1;
            model.setAttribute("scale",`${size}${size}${size}`);
        }

        enlargeButton.addEventListener("click",enlargeModel);


        function enlargeModel02(){
            size=size-0.1;
            model.setAttribute("scale",`${size}${size}${size}`);
        }
        enlargeButton02.addEventListener("click",enlargeModel02);

        let angle=0;

        function rotateModel(){
            angle+=15;
            model.setAttribute("rotation",`0 0 ${angle}`);
        }

        rotateButton.addEventListener("click",rotateModel);

        function rotateModel02(){
            angle-=15;
            model.setAttribute("rotation",`0 0 ${angle}`);
        }

        rotateButton02.addEventListener("click",rotateModel02);

        function changeAnimation(){
            ookami.setAttribute("animation-mixer","clip",animationSelect.value);
        }

        animationSelect.addEventListener("change",changeAnimation);
    </script>    
</body>

</html>
